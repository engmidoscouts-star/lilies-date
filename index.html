<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#e8dfcc"><title>A tiny ask ♡</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet"><style>
:root{--bg:#e9e1d0;--paper:#f6f0dc;--ink:#252a23;--red:#d34b37;--green:#b7cd9e;--border:#e5dac1}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 30%,#f0e8d8,var(--bg));font-family:'DM Sans',Arial,sans-serif;color:var(--ink);display:grid;place-items:center;overflow-x:hidden}main{width:min(94vw,440px);padding:32px 0 40px;position:relative}.brand{display:table;margin:0 auto 17px;padding:5px 11px;border:1px solid #d6b9a5;border-radius:30px;color:#c75a45;font-size:9px;font-weight:800;letter-spacing:1.5px}.brand:before{content:'✿ ';}.paper{position:relative;background:var(--paper);border:1px solid #eae0c9;border-radius:15px;box-shadow:0 15px 45px #776a4b1a;min-height:410px;padding:28px 26px;text-align:center;overflow:hidden}.paper:after{content:'';pointer-events:none;position:absolute;inset:8px;border:1px solid #ffffff60;border-radius:10px}.screen{display:none;position:relative;z-index:1;animation:appear .5s ease}.screen.active{display:block}@keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}.eyebrow{font-size:10px;letter-spacing:1.8px;font-weight:800;color:#756f60}.pill{border:1px solid #d8c8ad;border-radius:30px;padding:5px 9px;display:inline-block}.heading{font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(34px,8vw,49px);line-height:1.06;letter-spacing:-2px;margin:11px 0 12px}.heading em{color:var(--red);font-weight:400}.sub{font-size:12px;color:#7b7466;margin:8px 0}.flower{width:160px;height:160px;margin:8px auto 13px;display:block;filter:drop-shadow(0 5px 3px #b89c7b20);animation:sway 4s ease-in-out infinite;transform-origin:50% 80%}@keyframes sway{50%{transform:rotate(5deg)}}.yes{width:100%;border:0;border-radius:10px;background:var(--green);padding:15px 20px;font-size:19px;font-weight:800;color:#253323;cursor:pointer;box-shadow:0 5px 0 #9db78655;transition:transform .2s}.yes:hover{transform:translateY(-2px)}.no{position:absolute;right:5px;bottom:20px;background:#fff0df;border:1px solid #e7c7b5;color:#bd5947;border-radius:30px;padding:10px 13px;font-weight:700;font-size:11px;cursor:pointer;z-index:3;touch-action:none;transition:left .18s,top .18s,transform .18s}.counter{position:absolute;top:13px;right:14px;font-size:10px;border:1px solid #dfbda9;color:#c2604d;padding:5px 9px;border-radius:20px}.ask-area{position:relative;padding-bottom:46px}.form-title{font-size:38px;margin:13px 0 28px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}.field label{display:block;font-size:10px;font-weight:800;letter-spacing:1.2px;margin:0 0 7px;color:#746f5f}.field input{width:100%;min-width:0;padding:12px 9px;background:#faf5e6;border:1px solid #e1d8c3;border-radius:9px;font-family:inherit;color:#3c4237;font-size:13px}.plan-title{font-size:10px;font-weight:800;letter-spacing:1.2px;margin:25px 0 12px}.options{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.option{border:1px solid #c9d1b5;border-radius:25px;background:#dce5c9;padding:8px 12px;font:700 12px 'DM Sans',sans-serif;cursor:pointer;transition:.15s}.option.selected{background:var(--red);color:white;border-color:var(--red);transform:scale(1.04)}.action{margin-top:26px;width:100%;padding:15px 10px;border:0;border-radius:10px;background:var(--green);color:#33412b;font-weight:800;font-size:14px;cursor:pointer}.action:disabled{opacity:.55;cursor:not-allowed}.error{font-size:11px;color:#b34538;min-height:17px;margin-top:10px}.letter-title{margin:14px 0 17px}.letter{background:#f9f2dd;border:1px solid #e7dac0;border-radius:12px;padding:18px;text-align:left;font-family:'Playfair Display',Georgia,serif;font-size:15px;line-height:1.75;box-shadow:inset 0 0 20px #e3d2b329}.letter p{margin:0 0 12px}.details{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:14px}.details span{border:1px solid #d7d6b8;background:#e7eacb;border-radius:30px;padding:6px 9px;font-size:10px;font-weight:700}.share{background:var(--red);color:white;box-shadow:0 4px 0 #a6322855}.secondary{border:1px solid #d6c4ad;background:transparent;color:#a45d49;border-radius:20px;padding:8px 18px;margin-top:13px;cursor:pointer}.hearts{pointer-events:none;position:fixed;inset:0;overflow:hidden;z-index:9}.heart{position:absolute;bottom:-30px;animation:floatUp linear forwards}@keyframes floatUp{to{transform:translateY(-110vh) rotate(35deg);opacity:0}}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#34402e;color:white;padding:11px 17px;border-radius:30px;font-size:12px;opacity:0;transition:opacity .2s;z-index:12}.toast.show{opacity:1}@media(max-width:420px){main{padding:17px 0 25px}.paper{padding:25px 17px;min-height:390px}.flower{width:145px;height:145px}.form-title{font-size:34px}.option{font-size:11px;padding:8px 10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main><div class="brand">BUILD WITH LOVE</div><div class="paper">
<section id="ask" class="screen active"><div class="counter" id="counter">0 dodges</div><div class="ask-area" id="askArea"><div class="eyebrow">A TINY ASK</div><h1 class="heading">Will you go<br><em>out</em> with me?</h1><p class="sub" id="tease">Nice try — I dodged you.</p><svg class="flower" viewBox="0 0 180 180" aria-label="Pink lilies illustration" role="img" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="lilyPetal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ee"/><stop offset=".55" stop-color="#f6c6c5"/><stop offset="1" stop-color="#d98b9e"/></linearGradient></defs><path d="M87 108 Q91 141 103 174 M91 133 Q68 114 57 91" fill="none" stroke="#748e65" stroke-width="3" stroke-linecap="round"/><path d="M96 145 Q121 122 132 136 Q123 155 96 145 M89 130 Q59 119 60 140 Q75 150 89 130" fill="#b8c99c" stroke="#819b72" stroke-width="1"/><g stroke="#ce8d9e" stroke-width="1.2" fill="url(#lilyPetal)"><path d="M90 97 Q49 72 54 34 Q85 43 93 86Z"/><path d="M90 96 Q79 49 104 17 Q124 53 99 92Z"/><path d="M92 96 Q124 49 155 53 Q146 89 104 103Z"/><path d="M91 97 Q138 89 155 119 Q119 133 96 108Z"/><path d="M92 99 Q114 137 87 155 Q70 127 86 106Z"/><path d="M91 98 Q57 133 27 109 Q42 81 85 92Z"/></g><g fill="none" stroke="#b66c83" stroke-width="1" opacity=".5"><path d="M91 98L65 47 M94 97L103 34 M95 100L143 65 M95 103L143 114 M90 105L89 142 M88 101L39 108"/></g><g stroke="#87905a" stroke-width="1.7" stroke-linecap="round"><path d="M94 101L75 66 M94 101L117 64 M94 101L128 89 M94 101L72 119 M94 101L109 129"/></g><g fill="#b96b43"><ellipse cx="74" cy="64" rx="3" ry="5" transform="rotate(-28 74 64)"/><ellipse cx="118" cy="62" rx="3" ry="5" transform="rotate(27 118 62)"/><ellipse cx="130" cy="88" rx="5" ry="3"/><ellipse cx="70" cy="120" rx="4" ry="3"/><ellipse cx="110" cy="130" rx="3" ry="5"/></g><circle cx="94" cy="101" r="6" fill="#e7b56c"/></svg><button class="yes" id="yes">YES ♡</button><button class="no" id="no" type="button">No?</button></div></section>
<section id="planner" class="screen"><div class="eyebrow pill">LET'S MAKE IT OFFICIAL</div><h2 class="heading form-title">Pick the <em>day,</em><br><em>time</em>&amp; plan</h2><div class="form-grid"><div class="field"><label for="day">WHICH DAY?</label><input id="day" type="date" required></div><div class="field"><label for="time">WHAT TIME?</label><input id="time" type="time" required></div></div><div class="plan-title">THE PLAN</div><div class="options" id="options"><button class="option" data-plan="Coffee">☕ Coffee</button><button class="option" data-plan="A movie">🎬 A movie</button><button class="option" data-plan="Dinner">🍝 Dinner</button><button class="option" data-plan="Walk in the park">🌳 Walk in the park</button><button class="option" data-plan="Drinks">🍹 Drinks</button><button class="option" data-plan="Surprise me">🎁 Surprise me</button></div><button class="action" id="seal">Pick day, time &amp; plan ✍️</button><div class="error" id="error" role="status"></div></section>
<section id="result" class="screen"><div class="eyebrow pill">A LITTLE LETTER FOR YOU</div><div class="details" id="details" style="margin-top:18px"></div><div class="letter" id="letter"></div><button class="action share" id="share">💌 Share the good news 💌</button><button class="secondary" id="restart">Start over ↺</button></section>
</div></main><div class="hearts" id="hearts" aria-hidden="true"></div><div class="toast" id="toast" role="status">Copied ♡</div><script>
const $=id=>document.getElementById(id);let dodges=0,plan='',letterText='';const messages=['Nice try — I dodged you.','So shy.','You can’t catch me!','Are you suuure?','The YES button is right there ♡','I think you mean YES!'];function screen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id))}function dodge(e){if(e)e.preventDefault();dodges++;$('counter').textContent=dodges+' '+(dodges===1?'dodge':'dodges');$('tease').textContent=messages[Math.min(dodges,messages.length-1)];const btn=$('no'),area=$('askArea');const maxX=Math.max(0,area.clientWidth-btn.offsetWidth-12),maxY=Math.max(0,area.clientHeight-btn.offsetHeight-8);btn.style.left=(Math.random()*maxX)+'px';btn.style.top=(Math.random()*maxY)+'px';btn.style.right='auto';btn.style.bottom='auto'}const no=$('no');no.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')dodge(e)});no.addEventListener('pointerdown',dodge);no.addEventListener('click',dodge);$('yes').addEventListener('click',()=>{screen('planner');burst(18)});document.querySelectorAll('.option').forEach(b=>b.addEventListener('click',()=>{plan=b.dataset.plan;document.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x===b));$('error').textContent='';$('seal').textContent='Seal it with a letter 💌'}));const today=new Date();const localDate=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);$('day').min=localDate;function formatted(date,time){const d=new Date(date+'T12:00:00');return{day:d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}),time:new Date('2000-01-01T'+time).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true})}}function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('seal').addEventListener('click',()=>{const day=$('day').value,time=$('time').value;if(!day||!time||!plan){$('error').textContent='Please pick a day, time, and plan first ♡';return}if(day<localDate){$('error').textContent='Pick a date from today onward ♡';return}const f=formatted(day,time);const textPlan=plan==='Surprise me'?'a little surprise':plan.toLowerCase();letterText=`Dear you,\n\nSo... it’s official. It’s a date! ✨\n\nLet’s meet ${f.day} at ${f.time}, for ${textPlan}.\n\nI promise good vibes, terrible jokes, and my very best self.\n\nI already can’t stop smiling. See you there.\n\nYours (a little nervously),\n— Me ♡`;$('details').innerHTML=[`📅 ${f.day}`,`🕒 ${f.time}`,`♡ ${plan}`].map(x=>'<span>'+escapeHTML(x)+'</span>').join('');$('letter').innerHTML=letterText.split('\n\n').map(p=>'<p>'+escapeHTML(p).replace(/\n/g,'<br>')+'</p>').join('');screen('result');burst(45)});function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}$('share').addEventListener('click',async()=>{try{if(navigator.share){await navigator.share({title:'It’s a date! ♡',text:letterText});return}await navigator.clipboard.writeText(letterText);toast('Letter copied! Share it anywhere ♡')}catch(e){if(e.name==='AbortError')return;const t=document.createElement('textarea');t.value=letterText;document.body.append(t);t.select();document.execCommand('copy');t.remove();toast('Letter copied ♡')}});$('restart').addEventListener('click',()=>{screen('ask');dodges=0;plan='';$('counter').textContent='0 dodges';$('tease').textContent=messages[0];no.style.cssText='';document.querySelectorAll('.option').forEach(b=>b.classList.remove('selected'));$('day').value='';$('time').value='';$('seal').textContent='Pick day, time & plan ✍️'});function burst(n){const emojis=['💗','💖','💕','💛','❤️','💜'];for(let i=0;i<n;i++){const h=document.createElement('span');h.className='heart';h.textContent=emojis[Math.floor(Math.random()*emojis.length)];h.style.left=Math.random()*100+'vw';h.style.fontSize=(13+Math.random()*18)+'px';h.style.opacity=(.55+Math.random()*.45);h.style.animationDuration=(2.5+Math.random()*3)+'s';h.style.animationDelay=(Math.random()*1.4)+'s';$('hearts').append(h);setTimeout(()=>h.remove(),7000)}}
</script></body></html>
